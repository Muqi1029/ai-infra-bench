name: Release PyPI

on:
  workflow_dispatch:
    inputs:
      target_job:
        description: "Select relase dataset or main package"
        required: false
        type: choice
        default: "all"
        options:
          - all
          - dataset
          - main
  push:
    branches:
      - main
    paths:
      - "ai_infra_bench/version.py"

jobs:
  # Publish dataset first so the matching version exists when the main
  # package pins ai-infra-bench-dataset==<version>.
  publish-dataset:
    if: github.repository == 'Muqi1029/ai-infra-bench' && (inputs.target_job == 'all' || inputs.target_job == 'dataset')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bake version from ai_infra_bench/version.py
        run: |
          VERSION=$(python -c "from ai_infra_bench.version import __version__; print(__version__)")
          echo "__version__ = \"${VERSION}\"" > aib-dataset/ai_infra_bench_dataset/version.py
          echo "dataset version=${VERSION}"

      - name: Build and upload dataset package
        working-directory: aib-dataset
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
          python -m twine upload dist/*

  publish:
    if: github.repository == 'Muqi1029/ai-infra-bench' && (inputs.target_job == 'all' || inputs.target_job == 'main')
    needs: publish-dataset
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync optional data extra pin with version.py
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from ai_infra_bench.version import __version__

          path = Path("pyproject.toml")
          text = path.read_text(encoding="utf-8")
          new_text, n = re.subn(
              r'ai-infra-bench-dataset==[^"\']+',
              f"ai-infra-bench-dataset=={__version__}",
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(
                  f"expected to patch exactly 1 dataset pin, patched {n}"
              )
          path.write_text(new_text, encoding="utf-8")
          print(f"pinned ai-infra-bench-dataset=={__version__}")
          PY

      - name: Build and upload main package
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          python -m pip install -U pip build twine
          python -m build
          python -m twine check dist/*
          python -m twine upload dist/*
