name: Release PyPI

on:
  push:
    branches:
      - main
    paths:
      - "ai_infra_bench/version.py"

jobs:
  publish:
    if: github.repository == 'Muqi1029/ai-infra-bench'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4

      - name: Clone example code
        run: |
          mkdir -p ai_infra_bench/examples
          cp examples/*.py ai_infra_bench/examples/

      - name: Upload to PyPI
        run: |
          pip install build twine
          python -m build
          python -m twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}
