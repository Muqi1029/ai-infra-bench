[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infra-bench"
version = "0.1.3.post3"
description = "AI Infra bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["plotly", "numpy", "psutil", "requests", "tqdm", "hydra-core"]

[project.optional-dependencies]
data = ["datasets", "ai-infra-bench-dataset==0.1.3.post3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_infra_bench*"]

[project.scripts]
ai-infra-bench = "ai_infra_bench.cli:main"
ai-infra-bench-eval-dataset = "ai_infra_bench.check.correctness.eval_dataset.main:main"
ai-infra-bench-req = "ai_infra_bench.req:main"

[tool.setuptools.package-data]
"ai_infra_bench" = [
    "examples/*.py",
    "check/correctness/eval_dataset/configs/*.yaml",
]
