[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-infra-bench"
dynamic = ["version"]
description = "AI Infra bench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "openai",
    "plotly",
    "numpy",
    "psutil",
    "requests",
    "PyYAML",
    "tqdm",
    "hydra-core",
]

[project.optional-dependencies]
data = ["datasets", "transformers", "ai-infra-bench-dataset==0.1.4.post3"]
deepswe = ["datacurve-pier>=0.3.0; python_version >= '3.12'"]

[tool.setuptools.dynamic]
version = { attr = "ai_infra_bench.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_infra_bench*"]

[project.scripts]
aib = "ai_infra_bench.cli:main"

[tool.setuptools.package-data]
"ai_infra_bench" = [
    "correctness/eval_dataset/configs/*.yaml",
    "monitor/assets/*.json",
]
